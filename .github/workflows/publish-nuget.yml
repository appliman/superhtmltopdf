name: Publish to NuGet.org

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, and pack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build the solution
        run: dotnet build SuperHtmlToPdf.slnx --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Run tests for both target frameworks
        run: dotnet test SuperHtmlToPdf.slnx --configuration Release --no-build

      - name: Pack both libraries
        run: |
          dotnet pack src/SuperHtmlToPdf/SuperHtmlToPdf.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/SuperHtmlToPdf.Blazor/SuperHtmlToPdf.Blazor.csproj --configuration Release --no-build --output artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget-org
    permissions:
      id-token: write
    steps:
      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      - name: Download tested packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Sign in to NuGet.org with OIDC
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if [[ ${#packages[@]} -ne 2 ]]; then
            echo "Expected two NuGet packages, found ${#packages[@]}." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
